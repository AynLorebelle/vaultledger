<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#060c1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="emerald-glow" cx="50%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shield-stroke" x1="112" y1="72" x2="400" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shield-fill" x1="256" y1="84" x2="256" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111f35" />
      <stop offset="100%" stop-color="#071120" />
    </linearGradient>
    <linearGradient id="bar-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bar-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bar-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Obsidian app icon plate -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg-grad)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#emerald-glow)" />
  <rect x="26" y="26" width="460" height="460" rx="102" stroke="#1e293b" stroke-width="4" />

  <!-- Outer geometric vault shield -->
  <path
    d="M256 76 L396 128 V246 C396 334 336 394 256 432 C176 394 116 334 116 246 V128 L256 76 Z"
    fill="url(#shield-fill)"
    stroke="url(#shield-stroke)"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- Inner subtle vault frame -->
  <path
    d="M256 108 L368 150 V244 C368 314 320 364 256 396 C192 364 144 314 144 244 V150 L256 108 Z"
    stroke="#10b981"
    stroke-opacity="0.24"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Vault crest dial accent -->
  <circle cx="256" cy="154" r="10" fill="#34d399" />

  <!-- Rising ledger bars -->
  <rect x="178" y="264" width="38" height="72" rx="10" fill="url(#bar-1)" />
  <rect x="237" y="224" width="38" height="112" rx="10" fill="url(#bar-2)" />
  <rect x="296" y="182" width="38" height="154" rx="10" fill="url(#bar-3)" />

  <!-- Ledger baseline -->
  <rect x="174" y="346" width="164" height="10" rx="5" fill="#10b981" fill-opacity="0.55" />
</svg>
